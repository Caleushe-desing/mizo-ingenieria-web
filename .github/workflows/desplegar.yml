name: Despliegue Automático por FTP

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Compilar y Subir Sitio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build

      - name: Subir por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python - <<'PY'
          import ftplib
          import os
          import time
          from pathlib import Path

          local_root = Path("dist").resolve()
          remote_root = "/public_html"
          host = os.environ["FTP_SERVER"].strip().replace("ftp://", "").replace("ftps://", "").rstrip("/")
          port = int(os.environ.get("FTP_PORT") or 21)
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          MAX_ATTEMPTS = 5
          TIMEOUT = 180

          def connect():
              ftp = ftplib.FTP(timeout=TIMEOUT)
              print(f"Conectando a {host}:{port} ...")
              ftp.connect(host, port)
              ftp.login(user, password)
              ftp.set_pasv(True)
              return ftp

          def ensure_dir(ftp, remote_path):
              current = ""
              for part in remote_path.strip("/").split("/"):
                  current += f"/{part}"
                  try:
                      ftp.mkd(current)
                  except ftplib.error_perm as error:
                      if not str(error).startswith("550"):
                          raise

          # Datos vivos del VPS: clientes, proyectos, correos y claves.
          # Nunca se suben ni se borran, aunque aparezcan en dist.
          PROTECTED_DIRS = {"crm-data", "mail-files"}
          PROTECTED_FILES = {"mail.key"}

          def is_live_data(item):
              name = item.name.lower()
              if item.is_dir() and name in PROTECTED_DIRS:
                  return True
              if name in PROTECTED_FILES or name.startswith("crm.sqlite"):
                  return True
              return item.suffix.lower() in {".sqlite", ".sqlite-wal", ".sqlite-shm"}

          def upload_dir(ftp, local_dir, remote_dir):
              ensure_dir(ftp, remote_dir)
              for item in local_dir.iterdir():
                  if is_live_data(item):
                      print(f"Omitido (datos del VPS): {item}")
                      continue
                  remote_path = f"{remote_dir.rstrip('/')}/{item.name}"
                  if item.is_dir():
                      upload_dir(ftp, item, remote_path)
                      continue
                  with item.open("rb") as file:
                      print(f"Subiendo {item} -> {remote_path}")
                      ftp.storbinary(f"STOR {remote_path}", file)

          def delete_path(ftp, remote_path):
              base = remote_path.rstrip("/").split("/")[-1].lower()
              if base in {"crm", "crm-data", "mail-files", "mail.key"} or base.startswith("crm.sqlite"):
                  print(f"Conservado (datos del VPS): {remote_path}")
                  return
              try:
                  ftp.delete(remote_path)
                  print(f"Eliminado archivo {remote_path}")
                  return
              except ftplib.error_perm:
                  pass
              try:
                  names = ftp.nlst(remote_path)
              except ftplib.error_perm:
                  return
              for name in names:
                  base = name.rstrip("/").split("/")[-1]
                  if base in (".", ".."):
                      continue
                  child = f"{remote_path.rstrip('/')}/{base}"
                  delete_path(ftp, child)
              try:
                  ftp.rmd(remote_path)
                  print(f"Eliminado directorio {remote_path}")
              except ftplib.error_perm as error:
                  print(f"No se pudo eliminar {remote_path}: {error}")

          OBSOLETE = [
              "_astro",
              "admin",
              "admin-cms.js",
              "admin-manifest.webmanifest",
              "admin-notify-sw.js",
              "admin-nueva-cotizacion.php",
              "about",
              "blog",
              "carrito",
              "productos",
              "configurador",
              "catalogo-productos.json",
              "datos-privados.json",
              "equipamiento",
              "encuesta-satisfaccion",
              "gracias",
              "gracias-encuesta",
              "testimonios",
              "proyectos",
              "api-equipamiento.php",
              "api-productos-en-revision.php",
              "api-productos-publicados.php",
              "js",
              "fonts",
              "mizo-data",
              "images/productos",
              "images/clientes",
              "images/cms",
          ]

          def prune_old_site(ftp):
              for name in OBSOLETE:
                  delete_path(ftp, f"{remote_root.rstrip('/')}/{name}")
              api_dir = f"{remote_root.rstrip('/')}/api"
              try:
                  entries = []
                  ftp.retrlines(f"NLST {api_dir}", entries.append)
              except ftplib.error_perm:
                  return
              for name in entries:
                  base = name.rstrip("/").split("/")[-1]
                  if base in (".", "..", "contacto.php"):
                      continue
                  delete_path(ftp, f"{api_dir}/{base}")

          def deploy():
              ftp = connect()
              try:
                  prune_old_site(ftp)
                  upload_dir(ftp, local_root, remote_root)
              finally:
                  try:
                      ftp.quit()
                  except Exception:
                      pass

          last_error = None
          for attempt in range(1, MAX_ATTEMPTS + 1):
              try:
                  print(f"== Intento de despliegue {attempt}/{MAX_ATTEMPTS} ==")
                  deploy()
                  print("Despliegue FTP completado correctamente.")
                  last_error = None
                  break
              except Exception as error:
                  last_error = error
                  wait = attempt * 20
                  print(f"Fallo el intento {attempt}: {error}")
                  if attempt < MAX_ATTEMPTS:
                      print(f"Reintentando en {wait}s ...")
                      time.sleep(wait)

          if last_error is not None:
              raise SystemExit(f"Despliegue FTP fallido tras {MAX_ATTEMPTS} intentos: {last_error}")
          PY
