			<stop offset="50%" stop-color="#e2e8ef"/>
			<stop offset="100%" stop-color="#cfd8e3"/>
		</linearGradient>
		<radialGradient id="glowA" cx="10%" cy="5%" r="55%">
			<stop offset="0%" stop-color="#1c9bd8" stop-opacity="0.12"/>
			<stop offset="100%" stop-color="#1c9bd8" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowB" cx="95%" cy="95%" r="50%">
			<stop offset="0%" stop-color="#f47b20" stop-opacity="0.08"/>
