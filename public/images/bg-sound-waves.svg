<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#f8f9fb"/>
			<stop offset="38%" stop-color="#e9eef3"/>
			<stop offset="72%" stop-color="#d8e0e8"/>
			<stop offset="100%" stop-color="#c9d3de"/>
		</linearGradient>
		<linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
			<stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
			<stop offset="100%" stop-color="#1c9bd8" stop-opacity="0.06"/>
		</linearGradient>
		<radialGradient id="glowBlue" cx="18%" cy="22%" r="45%">
			<stop offset="0%" stop-color="#1c9bd8" stop-opacity="0.14"/>
			<stop offset="55%" stop-color="#1c9bd8" stop-opacity="0.04"/>
			<stop offset="100%" stop-color="#1c9bd8" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowOrange" cx="88%" cy="78%" r="40%">
			<stop offset="0%" stop-color="#f47b20" stop-opacity="0.1"/>
			<stop offset="60%" stop-color="#f47b20" stop-opacity="0.03"/>
			<stop offset="100%" stop-color="#f47b20" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="waveSilver" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#a8b4c0" stop-opacity="0"/>
			<stop offset="20%" stop-color="#8e9caa" stop-opacity="0.55"/>
			<stop offset="50%" stop-color="#6f7f8f" stop-opacity="0.35"/>
			<stop offset="80%" stop-color="#9eacb9" stop-opacity="0.5"/>
			<stop offset="100%" stop-color="#a8b4c0" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="waveBlue" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#1c9bd8" stop-opacity="0"/>
			<stop offset="40%" stop-color="#1c9bd8" stop-opacity="0.28"/>
			<stop offset="100%" stop-color="#0b6ea8" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="waveOrange" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#f47b20" stop-opacity="0"/>
			<stop offset="55%" stop-color="#f47b20" stop-opacity="0.22"/>
			<stop offset="100%" stop-color="#f47b20" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="1600" height="1000" fill="url(#base)"/>
	<rect width="1600" height="1000" fill="url(#glowBlue)"/>
	<rect width="1600" height="1000" fill="url(#glowOrange)"/>
	<rect width="1600" height="1000" fill="url(#sheen)"/>

	<!-- Ondas concéntricas (propagación de sonido) -->
	<g fill="none" stroke="#9aa8b8" stroke-opacity="0.28">
		<circle cx="220" cy="180" r="90" stroke-width="1"/>
		<circle cx="220" cy="180" r="150" stroke-width="1"/>
		<circle cx="220" cy="180" r="220" stroke-width="1.1"/>
		<circle cx="220" cy="180" r="300" stroke-width="1"/>
		<circle cx="220" cy="180" r="390" stroke-width="0.9"/>
	</g>
	<g fill="none" stroke="#1c9bd8" stroke-opacity="0.12">
		<circle cx="220" cy="180" r="120" stroke-width="1.2"/>
		<circle cx="220" cy="180" r="260" stroke-width="1"/>
	</g>
	<g fill="none" stroke="#b8c2cc" stroke-opacity="0.22">
		<circle cx="1380" cy="820" r="80" stroke-width="1"/>
		<circle cx="1380" cy="820" r="140" stroke-width="1"/>
		<circle cx="1380" cy="820" r="210" stroke-width="1"/>
		<circle cx="1380" cy="820" r="290" stroke-width="0.9"/>
	</g>
	<g fill="none" stroke="#f47b20" stroke-opacity="0.1">
		<circle cx="1380" cy="820" r="170" stroke-width="1.2"/>
	</g>

	<!-- Ondas sinusoidales (waveform) -->
	<path d="M-40 320 C 80 260, 200 380, 320 320 S 560 260, 680 320 S 920 380, 1040 320 S 1280 260, 1400 320 S 1640 380, 1760 320" fill="none" stroke="url(#waveSilver)" stroke-width="2.2" stroke-linecap="round"/>
	<path d="M-40 390 C 100 340, 220 440, 340 390 S 580 340, 700 390 S 940 440, 1060 390 S 1300 340, 1420 390 S 1660 440, 1780 390" fill="none" stroke="url(#waveBlue)" stroke-width="1.8" stroke-linecap="round"/>
	<path d="M-40 460 C 90 420, 210 500, 330 460 S 570 420, 690 460 S 930 500, 1050 460 S 1290 420, 1410 460 S 1650 500, 1770 460" fill="none" stroke="#aeb8c3" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round"/>
	<path d="M-40 530 C 110 480, 230 580, 350 530 S 590 480, 710 530 S 950 580, 1070 530 S 1310 480, 1430 530 S 1670 580, 1790 530" fill="none" stroke="url(#waveOrange)" stroke-width="1.6" stroke-linecap="round"/>
	<path d="M-40 600 C 80 570, 200 630, 320 600 S 560 570, 680 600 S 920 630, 1040 600 S 1280 570, 1400 600 S 1640 630, 1760 600" fill="none" stroke="#8f9eae" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round"/>

	<!-- Barras de ecualizador sutiles -->
	<g fill="#7f8f9f" fill-opacity="0.12">
		<rect x="1180" y="140" width="6" height="36" rx="2"/>
		<rect x="1192" y="124" width="6" height="52" rx="2"/>
		<rect x="1204" y="150" width="6" height="26" rx="2"/>
		<rect x="1216" y="118" width="6" height="58" rx="2"/>
		<rect x="1228" y="136" width="6" height="40" rx="2"/>
		<rect x="1240" y="128" width="6" height="48" rx="2"/>
		<rect x="1252" y="146" width="6" height="30" rx="2"/>
		<rect x="1264" y="112" width="6" height="64" rx="2"/>
		<rect x="1276" y="132" width="6" height="44" rx="2"/>
		<rect x="1288" y="122" width="6" height="54" rx="2"/>
	</g>
	<g fill="#1c9bd8" fill-opacity="0.1">
		<rect x="1192" y="124" width="6" height="52" rx="2"/>
		<rect x="1216" y="118" width="6" height="58" rx="2"/>
		<rect x="1264" y="112" width="6" height="64" rx="2"/>
	</g>
	<g fill="#f47b20" fill-opacity="0.08">
		<rect x="1228" y="136" width="6" height="40" rx="2"/>
		<rect x="1288" y="122" width="6" height="54" rx="2"/>
	</g>
</svg>
